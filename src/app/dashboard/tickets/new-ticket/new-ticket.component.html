<form (ngSubmit)="onSubmit(titleInput.value, textInput.value)">
  <app-control [label]="'Title'">
    <input id="title" type="text" name="title" #titleInput />
  </app-control>
  <app-control [label]="'Request'">
    <textarea
      id="request"
      type="text"
      name="request"
      rows="3"
      #textInput
    ></textarea>
  </app-control>
  <p>
    <button appButton type="submit">
      Submit
      <span ngProjectAs="icon">⌲</span>
    </button>
  </p>
</form>
