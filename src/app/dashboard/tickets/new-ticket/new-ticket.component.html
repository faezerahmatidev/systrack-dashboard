<form id="new-ticket">
  <app-control class="control" [label]="'Title'">
    <input id="title" type="text" name="title" />
  </app-control>
  <app-control class="control" [label]="'Request'">
    <textarea id="request" type="text" name="request" rows="3"></textarea>
  </app-control>
  <p>
    <button appButton type="submit">
      Submit
      <span ngProjectAs="icon">⌲</span>
    </button>
  </p>
</form>
