<form>
  <p>
    <label for="title">Title</label>
    <input id="title" type="text" name="title" />
  </p>
  <p>
    <label for="request">Request</label>
    <textarea id="request" type="text" name="request" rows="3"></textarea>
  </p>
  <p>
    <app-e-button
      [type]="'submit'"
      [label]="'Submit'"
      [icon]="'⌲'"
    ></app-e-button>
  </p>
</form>
